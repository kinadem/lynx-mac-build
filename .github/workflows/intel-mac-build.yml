name: Build LYNX Intel High Sierra candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/intel-mac-build.yml'
      - 'build_intel_mac.sh'
      - 'apply_high_sierra.py'
      - 'compatibility/**'
      - 'apply_compatibility.py'
      - 'verify_mac_bundle.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Confirm tools
        run: |
          xcodebuild -version
          cmake --version
          python3 --version
      - name: Build pinned source for Core 2 / macOS 10.13
        env:
          LYNX_BUILD_JOBS: '3'
          LYNX_MACOS_TARGET: '10.13'
        run: bash ./build_intel_mac.sh
      - name: Upload candidate and build-host checks
        uses: actions/upload-artifact@v7
        with:
          name: LYNX-Intel-High-Sierra-CANDIDATE
          path: work/output/*
          if-no-files-found: error
          retention-days: 7
